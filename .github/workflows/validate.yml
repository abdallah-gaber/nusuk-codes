name: Validate app and administrative pipeline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python3 -m venv admin/.venv
      - run: admin/.venv/bin/pip install -r admin/requirements-lock.txt
      - run: npm run lint && npm run lint:admin && npm run typecheck && npm test && npm run test:admin && npm run build
      - run: npm run test:emulator
